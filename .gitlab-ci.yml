include:
  - project: 'csirt-mu-analytics/analytics-artifacts'
    ref: 'master'
    file: 'ci-templates/base.gitlab-ci.yml'

.venv:
  image: python:3.12
  before_script:
    - pip install uv
    - uv sync --frozen --all-extras
    - source .venv/bin/activate

lint:
  stage: test
  extends: .venv
  script:
    - pre-commit run --all-files

pytest:
  stage: test
  extends: .venv
  script:
    - pytest

build:
  stage: build
  extends: .venv
  script:
    - uv build
  artifacts:
    paths:
      - dist/*

publish:
  stage: build
  needs:
    - build
  script:
    - export UV_PUBLISH_URL="${PUBLISH_URL}"
    - export UV_PUBLISH_USERNAME="${REGISTRY_USERNAME}"
    - export UV_PUBLISH_PASSWORD="${PACKAGE_REGISTRY_PUSH}"
    - uv publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^.+$/
